# nginx - bionicmotorsiklet.com  (KÖK DİZİN: https://bionicmotorsiklet.com/)
# Kurulum: /etc/nginx/sites-available/bionic  ->  sites-enabled'e symlink
# ÖNEMLİ: proxy_pass'te SONDAN SLASH YOK; uygulama kökte çalışır (BASE_PATH boş).
#         Eski /bionic/... adresleri 301 ile köke taşınır.

upstream bionic_app {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name bionicmotorsiklet.com www.bionicmotorsiklet.com;

  # Eski alt yol adresleri (eski linkler / arama motorları) köke yönlendirilir.
  location = /bionic { return 301 /; }
  location /bionic/ { return 301 /; }

  location / {
    proxy_pass http://bionic_app;         # sonunda "/" YOK
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 120s;
    client_max_body_size 25m;            # görsel yüklemeleri için
  }
}

# HTTPS: certbot --nginx -d bionicmotorsiklet.com -d www.bionicmotorsiklet.com --redirect
# 443 bloğunu certbot otomatik ekler; yukarıdaki location blokları aynen kalır.

# nginx - bionicmotorsiklet.com  (alt yol: /bionic/)
# Kurulum: /etc/nginx/sites-available/bionic  ->  sites-enabled'e symlink
# ÖNEMLİ: proxy_pass'te SONDAN SLASH YOK -> /bionic/ öneki KORUNUR ve uygulamaya iletilir.
#         Uygulama BASE_PATH=/bionic ile bu öneki bekler.

upstream bionic_app {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name bionicmotorsiklet.com www.bionicmotorsiklet.com;

  # certbot sonrası 80 -> 443 yönlendirmesi (certbot otomatik ekler).

  # Kök adres /bionic/ sayfasına gitsin (istenen davranış).
  location = / { return 301 /bionic/; }
  location = /bionic { return 301 /bionic/; }

  location /bionic/ {
    proxy_pass http://bionic_app;         # sonunda "/" YOK
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 120s;
    client_max_body_size 25m;            # görsel yüklemeleri için
  }
}


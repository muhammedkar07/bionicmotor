# nginx - TEST (STAGING) ORTAMI: test.bionicmotorsiklet.com  ->  127.0.0.1:3100
# Kurulum: /etc/nginx/sites-available/bionic-test  ->  sites-enabled'e symlink
# Canli site (bionicmotorsiklet.com) bundan ETKILENMEZ; ayri upstream + ayri surec.
# NOT: Bu dosyayi sunucuda sed ile DUZENLEMEYIN (tirnak/encoding bozulur); scp ile aktarin.

upstream bionic_test_app {
  server 127.0.0.1:3100;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name test.bionicmotorsiklet.com;

  # Hangi ortamin yanit verdigini ayirt etmeyi kolaylastirir + test ortami arama motorlarina kapali
  add_header X-Env-Test "yes" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location / {
    proxy_pass http://bionic_test_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 120s;
    client_max_body_size 25m;
  }
}

# HTTPS: DNS (test.bionicmotorsiklet.com -> sunucu IP) eklendikten sonra:
#   sudo certbot --nginx -d test.bionicmotorsiklet.com --redirect
# NOT: ana alan adinda HSTS "includeSubDomains" acik oldugu icin test alt alani da
#      gecerli sertifikaya sahip olmalidir.
